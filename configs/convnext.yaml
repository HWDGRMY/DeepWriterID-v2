model:
  name: "convnextv2_femto"
  num_classes: 1019
  feature_dim: 512
  pretrained: true
  pretrained_path: "pretrained/convnextv2_femto.safetensors"

data:
  image_size: 96
  batch_size: 128
  num_workers: 8

training:
  epochs: 50
  lr_base: 0.001
  weight_decay: 0.05
  warmup_epochs: 1
  eval_frequency: 5
  patience: 10
  drop_path: 0.1
  dropout_head: 0.3
  dropout_classifier: 0.4
  device: "cuda"

checkpoint:
  save_dir: "outputs/checkpoints"
  save_latest: "convnext_latest.pth"
  save_best: "convnext_best.pth"

logging:
  log_dir: "outputs/logs"
  log_file: "convnext_training_log.csv"

seed: 42