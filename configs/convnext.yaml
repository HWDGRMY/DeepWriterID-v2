model:
  name: "convnextv2_femto"
  num_classes: 1019
  feature_dim: 512

data:
  image_size: 96
  batch_size: 128
  num_workers: 8

training:
  epochs: 50
  initial_lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 5
  eval_frequency: 5      # 每 5 轮评估一次（v1.0 设计）
  patience: 10           # 早停
  drop_path: 0.1
  device: "cuda"

checkpoint:
  save_dir: "outputs/checkpoints"
  save_latest: "convnext_latest.pth"
  save_best: "convnext_best.pth"

logging:
  log_dir: "outputs/logs"
  log_file: "convnext_training_log.csv"

seed: 42