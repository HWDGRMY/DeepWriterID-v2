model:
  name: "convnextv2_tiny"
  num_classes: 1019
  feature_dim: 512

data:
  image_size: 54
  batch_size: 128            # 根据显存调整，原 DCNN 用 256
  num_workers: 6

training:
  epochs: 50
  initial_lr: 0.0001         # 论文 Tiny 是 8e-4 (batch=1024)，按线性缩放
  weight_decay: 0.05         # 论文推荐值
  warmup_epochs: 5           # 论文用 40，小数据适当减少
  cosine_T_max: 50
  drop_path: 0.1             # 论文 Tiny 用 0.2，小数据用 0.1 防过拟合
  device: "cuda"

checkpoint:
  save_dir: "outputs/checkpoints"
  save_latest: "convnext_latest.pth"
  save_best: "convnext_best.pth"

logging:
  log_dir: "outputs/logs"
  log_file: "convnext_training_log.csv"

seed: 42